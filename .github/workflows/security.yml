name: Security Scanners

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 4"

permissions:
  contents: read

jobs:
  security:
    name: Security
    permissions:
      contents: read
      security-events: write
    uses: fusiontechstrategies/FusionTechStrategies/.github/workflows/reusable-security.yml@f64c8eb98fa6c907e013d158089ea6ab38e91ad7
    with:
      semgrep_config: auto
      # The package declares and tests Python 3.10 or newer, so the Python 3.7
      # compatibility rule is inapplicable to this repository.
      semgrep_exclude_rules: python.lang.compatibility.python37.python37-compatibility-importlib2

  gitleaks-compatibility:
    name: Gitleaks
    if: always()
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve the protected Gitleaks contract
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$SECURITY_RESULT" = "success"

  required:
    name: Security scanners
    if: always()
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Preserve the protected scanner contract
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
        run: test "$SECURITY_RESULT" = "success"
