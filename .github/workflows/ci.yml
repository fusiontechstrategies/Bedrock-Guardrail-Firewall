name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile runtime
        run: python -m py_compile orchestrator.py

      - name: Run automated tests
        run: python -m unittest discover -s tests -v

      - name: Run built-in self-test
        run: python orchestrator.py --data-dir .ci-data --presidio-mode disabled self-test

      - name: Run built-in adversarial suite
        run: python orchestrator.py --data-dir .ci-data --presidio-mode disabled red-team

  quality:
    name: Quality and security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install development tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check formatting
        run: ruff format --check __init__.py orchestrator.py examples scripts tests

      - name: Lint
        run: ruff check __init__.py orchestrator.py examples scripts tests

      - name: Check public Markdown
        run: python scripts/check_public_markdown.py

      - name: Run coverage gate
        run: coverage run -m unittest discover -s tests && coverage report

      - name: Run static-security scan
        run: bandit -c pyproject.toml -r orchestrator.py examples scripts -q

      - name: Audit AWS dependencies
        run: pip-audit -r requirements-aws.txt --progress-spinner off

      - name: Audit Presidio dependencies
        run: pip-audit -r requirements-presidio.txt --progress-spinner off

      - name: Audit development dependencies
        run: pip-audit -r requirements-dev.txt --progress-spinner off

      - name: Audit distribution build dependencies
        run: pip-audit -r requirements-build.txt --progress-spinner off

  package:
    name: Build and install package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --disable-pip-version-check -r requirements-build.txt

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Test wheel from an isolated working directory
        shell: bash
        run: |
          WHEEL_PATH="$(python -c 'from pathlib import Path; print(next(Path("dist").glob("*.whl")).resolve())')"
          python -m venv "${RUNNER_TEMP}/package-smoke"
          "${RUNNER_TEMP}/package-smoke/bin/python" -m pip install --disable-pip-version-check --no-deps "${WHEEL_PATH}"
          "${RUNNER_TEMP}/package-smoke/bin/python" -m pip check
          cd "${RUNNER_TEMP}"
          test "$("${RUNNER_TEMP}/package-smoke/bin/bedrock-guardrail-firewall" --version)" = "bedrock-guardrail-firewall 4.1.0"
          "${RUNNER_TEMP}/package-smoke/bin/python" "${GITHUB_WORKSPACE}/scripts/validate_installed_package.py" core
          "${RUNNER_TEMP}/package-smoke/bin/bedrock-guardrail-firewall" --presidio-mode disabled doctor
          test -f "${RUNNER_TEMP}/.guardrail-data/privacy.key"
          "${RUNNER_TEMP}/package-smoke/bin/python" "${GITHUB_WORKSPACE}/examples/run_sanitized_demo.py"

          python -m venv "${RUNNER_TEMP}/package-presidio-smoke"
          "${RUNNER_TEMP}/package-presidio-smoke/bin/python" -m pip install --disable-pip-version-check "${WHEEL_PATH}[presidio]"
          "${RUNNER_TEMP}/package-presidio-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/package-presidio-smoke/bin/python" "${GITHUB_WORKSPACE}/scripts/validate_installed_package.py" missing-presidio-model
          "${RUNNER_TEMP}/package-presidio-smoke/bin/python" -m pip install --disable-pip-version-check -r requirements-presidio.txt
          "${RUNNER_TEMP}/package-presidio-smoke/bin/python" -m pip check
          "${RUNNER_TEMP}/package-presidio-smoke/bin/python" "${GITHUB_WORKSPACE}/scripts/validate_installed_package.py" presidio

  aws-sdk-contract:
    name: AWS SDK contract Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-aws.txt

      - name: Install pinned AWS SDK
        run: python -m pip install --disable-pip-version-check -r requirements-aws.txt

      - name: Verify ApplyGuardrail SDK model
        run: python -m unittest tests.test_optional_integrations.Boto3ContractTests -v

  presidio-integration:
    name: Presidio ${{ matrix.os }} Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-presidio.txt

      - name: Install pinned Presidio stack
        run: python -m pip install --disable-pip-version-check -r requirements-presidio.txt

      - name: Verify Presidio engine and redaction
        run: python -m unittest tests.test_optional_integrations.PresidioIntegrationTests -v

  required-checks:
    name: Required checks
    if: always()
    needs: [test, quality, package, aws-sdk-contract, presidio-integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm required jobs passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          AWS_CONTRACT_RESULT: ${{ needs.aws-sdk-contract.result }}
          PRESIDIO_RESULT: ${{ needs.presidio-integration.result }}
        run: |
          test "$TEST_RESULT" = "success"
          test "$QUALITY_RESULT" = "success"
          test "$PACKAGE_RESULT" = "success"
          test "$AWS_CONTRACT_RESULT" = "success"
          test "$PRESIDIO_RESULT" = "success"
