name: Release candidate

on:
  repository_dispatch:
    types: [release-candidate]

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  resolve:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.event.client_payload.source_commit }}
      RELEASE_TAG: ${{ github.event.client_payload.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Authenticate immutable tag and signed protected-main source as data
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ && "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(gh api "repos/$GH_REPO" --jq .default_branch)" = main
          test "$(gh api "repos/$GH_REPO/branches/main" --jq .protected)" = true
          test "$(gh api "repos/$GH_REPO/commits/$RELEASE_COMMIT" --jq .commit.verification.verified)" = true
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main
          python -I scripts/verify_release_integrity.py tag "$GH_REPO" "$RELEASE_TAG" "$RELEASE_COMMIT"
          echo "commit=$RELEASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    name: Build and verify release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.resolve.outputs.commit }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.lock

      - name: Install the hashed build dependency closure
        run: python -I -m pip install --disable-pip-version-check --require-hashes -r requirements-build.lock

      - name: Resolve the reproducible build epoch
        id: build-epoch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          echo "value=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build distributions
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build-epoch.outputs.value }}
        run: python -I -m build --no-isolation

      - name: Normalize the source distribution
        run: >-
          python scripts/normalize_sdist.py
          --source-date-epoch "${{ steps.build-epoch.outputs.value }}"
          dist/*.tar.gz

      - name: Rebuild and compare distribution bytes
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build-epoch.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          python -I -m build --no-isolation --outdir reproducibility-dist
          python scripts/normalize_sdist.py \
            --source-date-epoch "${{ steps.build-epoch.outputs.value }}" \
            reproducibility-dist/*.tar.gz
          test "$(find dist -maxdepth 1 -type f -printf '%f\n' | sort)" = \
            "$(find reproducibility-dist -maxdepth 1 -type f -printf '%f\n' | sort)"
          for artifact in dist/*; do
            cmp --silent "$artifact" "reproducibility-dist/${artifact##*/}"
          done

      - name: Validate distribution metadata
        run: python -I -m twine check dist/*

      - name: Validate archives and write integrity evidence
        run: >-
          python scripts/prepare_release_evidence.py
          --tag "$RELEASE_TAG"
          --commit "$RELEASE_COMMIT"

      - name: Store the read-only release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/*
            release-evidence/*
          if-no-files-found: error
          retention-days: 14
