name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify published release assets
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.release.tag_name }}

      - name: Check out trusted verification tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          path: trusted-verifier

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install trusted verification parsers in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/release-verifier"
          "$RUNNER_TEMP/release-verifier/bin/python" -m pip install \
            --disable-pip-version-check --only-binary=:all: --require-hashes \
            -r trusted-verifier/requirements-verifier.lock

      - name: Verify the tagged source commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"

      - name: Verify the exact published asset set
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -I -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          expected="$(printf '%s\n' \
            "bedrock_guardrail_firewall-${version}-py3-none-any.whl" \
            "bedrock_guardrail_firewall-${version}.tar.gz" \
            "bedrock-guardrail-firewall-${version}.spdx.json" \
            "release-evidence.json" \
            "SHA256SUMS.txt" | sort)"
          actual="$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | sort)"
          test "$expected" = "$actual" || {
            echo "The published release asset set is not the approved five-file set." >&2
            diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true
            exit 1
          }

      - name: Download the reviewed release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir dist published-evidence
          gh release download "$RELEASE_TAG" --pattern '*.whl' --pattern '*.tar.gz' --dir dist
          gh release download "$RELEASE_TAG" --pattern '*.spdx.json' --pattern 'release-evidence.json' --pattern 'SHA256SUMS.txt' --dir published-evidence

      - name: Authenticate candidate provenance before reading distributions
        shell: bash
        run: |
          set -euo pipefail
          for asset in dist/*; do
            gh attestation verify "$asset" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release-candidate.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_COMMIT" \
              --deny-self-hosted-runners
          done
          sha256sum dist/* > authenticated-distributions.sha256

      - name: Rebuild and compare integrity evidence
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/release-verifier/bin/python" -I trusted-verifier/scripts/prepare_release_evidence.py \
            --source-directory . \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --dist-directory dist \
            --output-directory generated-evidence
          cmp --silent published-evidence/release-evidence.json generated-evidence/release-evidence.json
          cmp --silent published-evidence/SHA256SUMS.txt generated-evidence/SHA256SUMS.txt
          cmp --silent published-evidence/*.spdx.json generated-evidence/*.spdx.json

      - name: Reauthenticate bytes immediately before upload
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check authenticated-distributions.sha256
          for asset in dist/*; do
            gh attestation verify "$asset" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release-candidate.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_COMMIT" \
              --deny-self-hosted-runners
          done

      - name: Store the reverified distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-python-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  pypi-publish:
    name: Publish distributions to PyPI
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/bedrock-guardrail-firewall
    permissions:
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_COMMIT: ${{ github.sha }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the reverified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-python-distributions
          path: dist

      - name: Authenticate final distributions in the publishing job
        shell: bash
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 2
          for asset in dist/*; do
            if [[ "$asset" != *.whl && "$asset" != *.tar.gz ]]; then
              exit 1
            fi
            gh attestation verify "$asset" \
              --repo "$GH_REPO" \
              --signer-workflow "$GH_REPO/.github/workflows/release-candidate.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" \
              --source-digest "$RELEASE_COMMIT" \
              --deny-self-hosted-runners
          done

      - name: Publish with PyPI trusted publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          attestations: true
          print-hash: true
